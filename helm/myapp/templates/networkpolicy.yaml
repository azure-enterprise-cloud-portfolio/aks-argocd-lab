# =============================================================================
# Network Policies — myapp
#
# deny-all:
#   Default deny all ingress and egress for the namespace.
#   Forces explicit allow rules — zero-trust posture.
#
# allow-same-namespace:
#   Allows pods within the same namespace to communicate.
#   Required for multi-pod apps and ArgoCD health checks.
# =============================================================================

# Deny all ingress and egress by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Allow traffic between pods in the same namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
