# =============================================================================
# Terraform Workloads Workflow
# Runs plan on every PR and push to main.
# Applies only on push to main — dev auto-deploys, no manual approval needed.
#
# Auth: OIDC federated credentials — no client secrets stored in GitHub.
# State: Stored in Azure Blob Storage in platform subscription.
# Concurrency: Shared group with platform workflow — prevents state lock conflicts.
# =============================================================================

name: Terraform Workloads

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/envs/dev/**"
      - "terraform/modules/**"
      - ".github/workflows/terraform-workloads.yml"

  push:
    branches:
      - main
    paths:
      - "terraform/envs/dev/**"
      - "terraform/modules/**"
      - ".github/workflows/terraform-workloads.yml"

# OIDC auth requires id-token write; contents read for checkout
permissions:
  id-token: write
  contents: read

# Only one Terraform workflow runs at a time — prevents state lock conflicts
concurrency:
  group: terraform-state
  cancel-in-progress: false # queue rather than cancel

env:
  TF_VERSION: "1.14.3"        # Align with required_version in versions.tf
  TF_WORKING_DIR: terraform/envs/dev

jobs:
  # ===========================================================================
  # Plan Dev
  # Runs on every PR and push to main.
  # Validates, formats, and plans — never applies.
  # Uploads plan artifact on push to main for apply job to consume.
  # ===========================================================================
  plan-dev:
    name: Plan Dev
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        # Login with platform subscription — Terraform provider aliases handle
        # cross-subscription access for dev and platform resources separately.
        # Avoids issues with AZURE_DEV_SUBSCRIPTION_ID being used for backend auth.
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # Required for detailed-exitcode to work correctly

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        # Backend lives in platform subscription — pass platform subscription ID for state access
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="use_oidc=true" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}"

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        # Exit codes: 0 = no changes, 1 = error, 2 = changes present
        # set +e prevents bash from exiting on non-zero codes
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set +e
          terraform plan -detailed-exitcode -out=tfplan
          exit_code=$?
          echo "Terraform plan exit code: $exit_code"
          if [ $exit_code -eq 1 ]; then
            echo "Terraform plan failed with error"
            exit 1
          fi
          echo "Terraform plan succeeded"
          exit 0
        env:
          TF_VAR_dev_subscription_id:      ${{ secrets.AZURE_DEV_SUBSCRIPTION_ID }}
          TF_VAR_platform_subscription_id: ${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}

      - name: Upload Plan Artifact
        # Only upload on push to main — apply job will consume this exact plan file
        # Skipped on PRs since we never apply from PRs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  # ===========================================================================
  # Apply Dev
  # Runs only on push to main after plan succeeds.
  # No manual approval — dev auto-deploys on merge to main.
  # Applies exactly the plan file produced by the plan job — no drift.
  # ===========================================================================
  apply-dev:
    name: Apply Dev
    needs: plan-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # No required reviewers — dev auto-deploys
    # Add reviewers in GitHub Settings → Environments → workload-dev for test/prod
    environment: workload-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        # OIDC tokens are job-scoped — must re-authenticate in every job
        # Login with platform subscription — same reason as plan job above
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        # Re-init required — each job runs on a fresh runner with no local state
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="use_oidc=true" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}"

      - name: Download Plan Artifact
        # Downloads exactly the plan produced by plan-dev
        # Guarantees apply matches what was planned — no drift
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        # -auto-approve is safe here — plan was already reviewed in plan-dev
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_dev_subscription_id:      ${{ secrets.AZURE_DEV_SUBSCRIPTION_ID }}
          TF_VAR_platform_subscription_id: ${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}

  # ===========================================================================
  # Test & Prod — Uncomment when environments are ready
  # Also add org secrets: AZURE_TEST_SUBSCRIPTION_ID, AZURE_PROD_SUBSCRIPTION_ID
  # Also create GitHub environments: workload-test, workload-prod (with required reviewers)
  # ===========================================================================

  # plan-test:
  #   ...

  # apply-test:
  #   ...

  # plan-prod:
  #   ...

  # apply-prod:
  #   ...